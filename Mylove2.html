<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Happy Birthday 💖</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { overflow-x: hidden; cursor: none; }

    /* 🌈 Smooth luxury gradient */
    body {
      background: linear-gradient(135deg, #ffe4f2, #ffd6e7, #fff0f7);
      background-size: 300% 300%;
      animation: bgFlow 15s ease infinite;
    }
    @keyframes bgFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* 💎 Glass upgrade */
    .glass {
      background: rgba(255,255,255,0.25);
      backdrop-filter: blur(25px) saturate(180%);
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.3);
      box-shadow: 0 20px 60px rgba(255,0,100,0.15);
    }

    /* 💖 Ultra smooth hearts */
    @keyframes float {
      0% { transform: translateY(110vh) scale(0.5); opacity: 0; }
      20% { opacity: 0.8; }
      100% { transform: translateY(-20vh) scale(1.2); opacity: 0; }
    }
    .heart {
      position: fixed;
      bottom: -50px;
      font-size: 18px;
      animation: float linear infinite;
      filter: blur(0.3px);
      opacity: 0.8;
      pointer-events: none;
    }

    /* ✨ Glow cursor upgraded */
    .cursor {
      position: fixed;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: rgba(255,105,180,0.7);
      pointer-events: none;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 15px pink, 0 0 35px hotpink, 0 0 60px deeppink;
      z-index: 9999;
      transition: transform 0.05s linear;
    }

    /* 🎆 Cinematic burst */
    @keyframes burst {
      0% { transform: scale(0) translate(0,0); opacity: 1; }
      100% { transform: scale(1.2) translate(var(--x), var(--y)); opacity: 0; }
    }
    .confetti {
      position: fixed;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      pointer-events: none;
      animation: burst 1.2s cubic-bezier(.2,.8,.2,1) forwards;
    }

    /* ✨ Fade */
    .fade-in {
      animation: fadeIn 1.5s ease forwards;
      opacity: 0;
      transform: translateY(20px);
    }
    @keyframes fadeIn {
      to { opacity: 1; transform: translateY(0); }
    }

    /* 💓 Button pulse */
    @keyframes pulse {
      0%,100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    /* 💌 Modal */
    .modal {
      animation: zoomIn 0.5s cubic-bezier(.2,.8,.2,1);
    }
    @keyframes zoomIn {
      from { transform: scale(0.5); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  

    /* 💘 Click ripple effect */
    @keyframes ripple {
      0% { transform: scale(0.2); opacity: 0.9; }
      100% { transform: scale(2.5); opacity: 0; }
    }
    .ripple {
      position: fixed;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: rgba(255,105,180,0.6);
      pointer-events: none;
      animation: ripple 0.8s ease-out forwards;
      box-shadow: 0 0 20px pink, 0 0 40px hotpink;
      z-index: 9998;
    }

    /* 💖 Heart click pop */
    @keyframes popHeart {
      0% { transform: scale(0.5); opacity: 1; }
      100% { transform: scale(1.8) translateY(-30px); opacity: 0; }
    }
    .click-heart {
      position: fixed;
      font-size: 20px;
      pointer-events: none;
      animation: popHeart 0.8s ease-out forwards;
      z-index: 9998;
    }

  

    /* 🌊 Button wave effect (pink + purple) */
    .btn-wave {
      position: relative;
      overflow: hidden;
    }
    .btn-wave span {
      position: absolute;
      border-radius: 50%;
      transform: scale(0);
      animation: wave 0.8s linear;
      background: radial-gradient(circle, rgba(255,105,180,0.6), rgba(186,85,211,0.5));
    }
    @keyframes wave {
      to {
        transform: scale(4);
        opacity: 0;
      }
    }

  </style>
</head>

<body class="font-sans">

<!-- ✨ cursor -->
<div class="cursor" id="cursor"></div>

<script>
  const cursor = document.getElementById('cursor');
  document.addEventListener('mousemove', e => {
    cursor.style.left = e.clientX + 'px';
    cursor.style.top = e.clientY + 'px';
  });
</script>

<!-- 💖 Hearts -->
<script>
  for (let i = 0; i < 40; i++) {
    let heart = document.createElement('div');
    heart.className = 'heart';
    heart.innerHTML = '💖';
    heart.style.left = Math.random() * 100 + 'vw';
    heart.style.animationDuration = (6 + Math.random() * 6) + 's';
    heart.style.opacity = Math.random();
    document.body.appendChild(heart);
  }
</script>

<!-- 🎉 Main -->
<div class="h-screen flex items-center justify-center text-center px-4">
  <div class="glass p-12 max-w-md fade-in">
    <h1 class="text-5xl font-bold text-pink-600">Happy Birthday 🎂</h1>

    <p class="mt-4 text-gray-800">
      สุขสันต์วันเกิดนะคนเก่ง 💖
    </p>

    <button onclick="showMessage(event)"
      class="mt-6 bg-pink-500 text-white px-6 py-3 rounded-full shadow-xl hover:bg-pink-600 btn-wave"
      style="animation: pulse 2s infinite;">
      กดดูข้อความลับ 💌
    </button>
  </div>
</div>

<!-- 💌 Message -->
<div id="message" class="hidden fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center">
  <div class="bg-white p-8 rounded-2xl text-center max-w-md modal">
    <h2 class="text-2xl font-bold text-pink-500">ถึงเธอ 💖</h2>
    <p class="mt-4 text-gray-700">
      ขอบคุณที่เข้ามาในชีวิตเรา 💕<br>
      อยู่ด้วยกันไปนานๆนะ<br>
      รักเธอมากๆเลย 🎂✨
    </p>
    <button onclick="closeMessage()" class="mt-4 bg-pink-500 text-white px-4 py-2 rounded-full">ปิด</button>
  </div>
</div>

<script>
  function showMessage(e) {
    createWave(e);
    document.getElementById('message').classList.remove('hidden');
    burstConfetti();
  }

  function closeMessage() {
    document.getElementById('message').classList.add('hidden');
  }

  function burstConfetti() {
    for (let i = 0; i < 150; i++) {
      let c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = window.innerWidth / 2 + 'px';
      c.style.top = window.innerHeight / 2 + 'px';
      c.style.background = `hsl(${Math.random()*360},100%,65%)`;

      let angle = Math.random() * 2 * Math.PI;
      let radius = 250 + Math.random() * 250;
      c.style.setProperty('--x', Math.cos(angle) * radius + 'px');
      c.style.setProperty('--y', Math.sin(angle) * radius + 'px');

      document.body.appendChild(c);
      setTimeout(() => c.remove(), 1200);
    }
  }

function createWave(e) {
  const button = e.currentTarget;
  const circle = document.createElement('span');
  const diameter = Math.max(button.clientWidth, button.clientHeight);

  circle.style.width = circle.style.height = diameter + 'px';
  circle.style.left = e.offsetX - diameter / 2 + 'px';
  circle.style.top = e.offsetY - diameter / 2 + 'px';

  button.appendChild(circle);

  setTimeout(() => circle.remove(), 800);
}
</script>

<script>
  /* 💘 Click effect */
  document.addEventListener('click', (e) => {
    // ripple
    let r = document.createElement('div');
    r.className = 'ripple';
    r.style.left = e.clientX - 10 + 'px';
    r.style.top = e.clientY - 10 + 'px';
    document.body.appendChild(r);
    setTimeout(() => r.remove(), 800);

    // heart pop
    let h = document.createElement('div');
    h.className = 'click-heart';
    h.innerHTML = '💖';
    h.style.left = e.clientX + 'px';
    h.style.top = e.clientY + 'px';
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 800);
  });
</script>

</body>
</html>
