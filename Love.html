<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Happy Birthday 💖</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      overflow-x: hidden;
    }

    /* ✨ Floating hearts */
    @keyframes float {
      0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
    }

    .heart {
      position: fixed;
      bottom: -50px;
      font-size: 24px;
      animation: float 6s linear infinite;
    }

    /* 💖 Fade in */
    .fade-in {
      animation: fadeIn 2s ease forwards;
      opacity: 0;
    }

    @keyframes fadeIn {
      to { opacity: 1; transform: translateY(0); }
    }

    /* 🎂 Pulse */
    @keyframes pulse {
      0%,100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
  </style>
</head>

<body class="bg-pink-100 font-sans">

<!-- 💖 Floating Hearts -->
<script>
  for (let i = 0; i < 20; i++) {
    let heart = document.createElement('div');
    heart.className = 'heart';
    heart.innerHTML = '💖';
    heart.style.left = Math.random() * 100 + 'vw';
    heart.style.animationDuration = (4 + Math.random() * 4) + 's';
    document.body.appendChild(heart);
  }
</script>

<!-- 🎉 Main Section -->
<div class="h-screen flex flex-col items-center justify-center text-center">
  <h1 class="text-5xl font-bold text-pink-600 fade-in">Happy Birthday 🎂</h1>
  <p class="mt-4 text-lg text-gray-700 fade-in" style="animation-delay:0.5s;">
    สุขสันต์วันเกิดนะคนเก่งของเค้า 💖
  </p>

  <div class="mt-6 fade-in" style="animation-delay:1s;">
    <button onclick="showMessage()" class="bg-pink-500 text-white px-6 py-3 rounded-full shadow-lg hover:bg-pink-600" style="animation: pulse 2s infinite;">
      กดดูข้อความลับ 💌
    </button>
  </div>
</div>

<!-- 💌 Hidden Message -->
<div id="message" class="hidden fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center">
  <div class="bg-white p-8 rounded-2xl text-center max-w-md">
    <h2 class="text-2xl font-bold text-pink-500">ถึงเธอ 💖</h2>
    <p class="mt-4 text-gray-700">
      ขอบคุณที่เข้ามาในชีวิตเค้า 💕
      อยู่ด้วยกันไปนานๆน้าาาาาาาาาา
      รักเธอมากๆเยยยยยยยยยย 🎂✨
    </p>
    <button onclick="closeMessage()" class="mt-4 bg-pink-500 text-white px-4 py-2 rounded-full">ปิด</button>
  </div>
</div>

<script>
  function showMessage() {
    document.getElementById('message').classList.remove('hidden');
  }

  function closeMessage() {
    document.getElementById('message').classList.add('hidden');
  }
</script>

</body>
</html>
